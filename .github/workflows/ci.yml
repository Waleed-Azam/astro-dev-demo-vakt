name: CI — check, build, smoke-test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm run build:no-check
      - name: Smoke test — required routes exist
        run: |
          for r in index.html pricing/index.html docs/index.html docs/quickstart/index.html changelog/index.html status/index.html signup/index.html 404.html; do
            test -f "dist/$r" || (echo "MISSING dist/$r" && exit 1)
          done
          echo "✓ all routes built"
