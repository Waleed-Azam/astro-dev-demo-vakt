<svg xmlns="http://www.w3.org/2000/svg" width="1960" height="600" viewBox="0 0 980 300" role="img" aria-label="Vakt architecture: visitor to Cloudflare Pages, waitlist function, Resend and Railway">
<rect x="-40" y="-40" width="1060" height="380" rx="24" fill="#0b1120"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#626d89"/></marker></defs>
<g font-family="monospace" font-size="15">
<rect x="10" y="110" width="150" height="80" rx="12" fill="#c8f04b"/><text x="85" y="142" fill="#141a08" text-anchor="middle" font-weight="bold">visitor</text><text x="85" y="164" fill="#141a08" text-anchor="middle" font-size="12">browser</text>
<rect x="210" y="60" width="220" height="180" rx="12" fill="#0e1628" stroke="#1e2a45" stroke-width="2"/><text x="320" y="92" text-anchor="middle" fill="#edf1f8" font-weight="bold">Cloudflare Pages</text><text x="320" y="118" text-anchor="middle" fill="#9aa4bb" font-size="12">static pages (edge)</text><text x="320" y="160" text-anchor="middle" fill="#9aa4bb" font-size="12">/ · /pricing · /docs</text><text x="320" y="182" text-anchor="middle" fill="#9aa4bb" font-size="12">/status · /signup</text><text x="320" y="216" text-anchor="middle" fill="#c8f04b" font-size="12">~12 KB client JS</text>
<rect x="480" y="110" width="180" height="80" rx="12" fill="#0e1628" stroke="#c8f04b" stroke-width="2"/><text x="570" y="142" text-anchor="middle" fill="#edf1f8" font-weight="bold">/api/waitlist</text><text x="570" y="164" text-anchor="middle" fill="#9aa4bb" font-size="12">Function · validates</text>
<rect x="710" y="40" width="250" height="100" rx="12" fill="#0e1628" stroke="#1e2a45" stroke-width="2"/><text x="835" y="72" text-anchor="middle" fill="#edf1f8" font-weight="bold">Resend</text><text x="835" y="94" text-anchor="middle" fill="#9aa4bb" font-size="12">transactional email</text><text x="835" y="116" text-anchor="middle" fill="#9aa4bb" font-size="12">reply-to = visitor</text>
<rect x="710" y="160" width="250" height="100" rx="12" fill="#0e1628" stroke="#1e2a45" stroke-width="2"/><text x="835" y="192" text-anchor="middle" fill="#edf1f8" font-weight="bold">Railway API</text><text x="835" y="214" text-anchor="middle" fill="#9aa4bb" font-size="12">waitlist backup + log</text><text x="835" y="236" text-anchor="middle" fill="#9aa4bb" font-size="12">/api/newsletter</text>
<line x1="160" y1="150" x2="205" y2="150" stroke="#626d89" stroke-width="2" marker-end="url(#arr)"/>
<line x1="430" y1="150" x2="475" y2="150" stroke="#626d89" stroke-width="2" marker-end="url(#arr)"/>
<line x1="660" y1="130" x2="705" y2="95" stroke="#626d89" stroke-width="2" marker-end="url(#arr)"/>
<line x1="660" y1="170" x2="705" y2="205" stroke="#626d89" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/>
